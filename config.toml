baseURL = "https://faro.fdfont.com/"
languageCode = "es-ES"
defaultContentLanguage = "es"
title = "Faro | fdfont"
theme = "PaperMod"
copyright = "Faro · fdfont"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 28

[pagination]
  pagerSize = 12

[server]
  disableFastRender = true

[params]
  env = "production"
  defaultTheme = "dark"
  DateFormat = "2 de January de 2006"
  disableThemeToggle = false
  description = "Textos desde la frontera de la conciencia. Una bitácora de conciencia, código y alma."
  siteDescription = "Exploración de conciencia, tecnología y estética posthumana."
  author = "fdfont"
  keywords = ["conciencia", "tecnología", "posthumanismo", "ficción especulativa", "Era Sintética"]
  images = ["/optimized/img/20250528-faro-universo.webp"]
  mainSections = ["bitacora", "fragmentos", "arafura", "mrconcept"]
  ShowShareButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  ShowCodeCopyButtons = true
  tts = true

  [params.privacy]
    googleAnalyticsID = "G-48NSGTEX0J"

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    theme_color = "#000c1a"
    msapplication_TileColor = "#000c1a"

  [params.footer]
    text = "Textos desde la frontera de la conciencia"

[menu]
  [[menu.main]]
    identifier = "arafura"
    name = "Arafura"
    url = "/arafura/"
    weight = 10
  [[menu.main]]
    identifier = "bitacora"
    name = "Bitácora"
    url = "/bitacora/"
    weight = 20
  [[menu.main]]
    identifier = "fragmentos"
    name = "Fragmentos"
    url = "/fragmentos/"
    weight = 30
  [[menu.main]]
    identifier = "mrconcept"
    name = "MRCONCEPT©"
    url = "/mrconcept/"
    weight = 40
  [[menu.main]]
    identifier = "resonancia"
    name = "Resonancia"
    url = "/resonancia/"
    weight = 50
  [[menu.main]]
    identifier = "comic"
    name = "Cómic"
    url = "/comic/"
    weight = 60
  [[menu.main]]
    identifier = "nadie"
    name = "Zona Nadie"
    url = "/nadie/"
    weight = 70

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false

[minify]
  minifyOutput = true
