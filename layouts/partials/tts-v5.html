<div id="tts-controls" style="margin-bottom: 20px;">
  <button id="global-tts-play" onclick="ttsPlay()" style="cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: transparent; color: inherit;">🔊 Escuchar</button>
  <button id="global-tts-pause" onclick="ttsPause()" style="display:none; cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: transparent; color: inherit;">⏸ Pausar</button>
  <button id="global-tts-stop" onclick="ttsStop()" style="display:none; cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: transparent; color: inherit;">⏹ Detener</button>
</div>

<script>
  let utterance;
  let isSpeaking = false;
  let isPaused = false;

  let chunks = [];
  let currentChunk = 0;

  function ttsPlay() {
    console.log("TTS Play V2 triggered");
    const container = document.getElementById('tts-text-container-v2');
    if (!container) return;

    // Usar textContent (bruto) para evitar problemas de visibilidad
    let content = container.textContent || '';
    console.log("Raw textContent length:", content.length);
    
    // Split por saltos de línea y filtrar líneas con letras
    chunks = content.split('\n')
      .map(s => s.trim().replace(/#$/, '')) // Quitar el '#' de los anchors de PaperMod
      .filter(s => s.length > 2 && /[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(s));
    
    console.log(`Split into ${chunks.length} chunks`);
    if (chunks.length > 0) {
      console.log("Chunk 1 text:", chunks[0]);
      currentChunk = 0;
      speakNextChunk();
    } else {
      alert("No se pudo extraer texto legible.");
    }
  }

  function speakNextChunk() {
    if (currentChunk >= chunks.length) {
      console.log("All chunks finished");
      resetTTS();
      return;
    }

    const text = chunks[currentChunk].trim();
    if (text.length < 2) {
      currentChunk++;
      speakNextChunk();
      return;
    }

    console.log(`Speaking chunk ${currentChunk + 1}/${chunks.length} ("${text.substring(0, 30)}...")`);
    
    utterance = new SpeechSynthesisUtterance(text);
    
    // Intentar encontrar una voz en español
    const voices = speechSynthesis.getVoices();
    const esVoice = voices.find(v => v.lang.startsWith('es'));
    if (esVoice) {
      utterance.voice = esVoice;
      utterance.lang = esVoice.lang;
    } else {
      utterance.lang = 'es-ES';
    }

    utterance.rate = 1.0;
    utterance.pitch = 1.0;

    utterance.onstart = () => {
      isSpeaking = true;
      isPaused = false;
      document.getElementById('global-tts-play').style.display = 'none';
      document.getElementById('global-tts-pause').style.display = 'inline-block';
      document.getElementById('global-tts-stop').style.display = 'inline-block';
    };

    utterance.onend = () => {
      console.log(`Finished chunk ${currentChunk + 1}`);
      currentChunk++;
      speakNextChunk();
    };

    utterance.onerror = (e) => {
      console.error(`Error in chunk ${currentChunk + 1}:`, e.error);
      currentChunk++;
      speakNextChunk();
    };

    speechSynthesis.speak(utterance);
  }

  function ttsPause() {
    const btn = document.getElementById('global-tts-pause');
    if (isSpeaking && !isPaused) {
      speechSynthesis.pause();
      isPaused = true;
      btn.innerText = '▶️ Reanudar';
    } else if (isPaused) {
      speechSynthesis.resume();
      isPaused = false;
      btn.innerText = '⏸ Pausar';
    }
  }

  function ttsStop() {
    chunks = [];
    currentChunk = 0;
    speechSynthesis.cancel();
    resetTTS();
  }

  function resetTTS() {
    isSpeaking = false;
    isPaused = false;
    chunks = [];
    currentChunk = 0;
    const playBtn = document.getElementById('global-tts-play');
    const pauseBtn = document.getElementById('global-tts-pause');
    const stopBtn = document.getElementById('global-tts-stop');
    if (playBtn) playBtn.style.display = 'inline-block';
    if (pauseBtn) {
      pauseBtn.style.display = 'none';
      pauseBtn.innerText = '⏸ Pausar';
    }
    if (stopBtn) stopBtn.style.display = 'none';
  }

  // Pausar si el usuario cambia de pestaña o minimiza la ventana
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isSpeaking && !isPaused) {
      speechSynthesis.pause();
      isPaused = true;
      const btn = document.getElementById('global-tts-pause');
      if (btn) btn.innerText = '▶️ Reanudar';
    }
  });
</script>
