<div class="faro-tts" data-tts-controls aria-label="Controles de lectura en voz alta">
  <button type="button" data-tts-play aria-pressed="false">🔊 Escuchar</button>
  <button type="button" data-tts-pause hidden>⏸ Pausar</button>
  <button type="button" data-tts-stop hidden>⏹ Detener</button>
  <label for="tts-rate">Velocidad</label>
  <select id="tts-rate" data-tts-rate>
    <option value="0.8">0,8×</option>
    <option value="1" selected>1×</option>
    <option value="1.2">1,2×</option>
    <option value="1.5">1,5×</option>
  </select>
  <span data-tts-status role="status" aria-live="polite"></span>
</div>
