<section class="nobody-zone" data-nobody-zone aria-labelledby="nobody-zone-title">
  <header>
    <p class="faro-kicker">Canal local experimental</p>
    <h2 id="nobody-zone-title">Zona Nadie</h2>
    <p>Los mensajes se guardan en este dispositivo y se envían al buzón de moderación de Faro.</p>
  </header>

  <form class="nobody-form" name="comentario-zona-nadie" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/">
    <input type="hidden" name="form-name" value="comentario-zona-nadie">
    <p hidden><label>No llenar si eres humano: <input name="bot-field"></label></p>
    <label for="nobody-title">Título <span>(opcional)</span></label>
    <input id="nobody-title" type="text" name="title" maxlength="100" autocomplete="off">
    <label for="nobody-text">Mensaje</label>
    <textarea id="nobody-text" name="text" rows="5" maxlength="2000" required></textarea>
    <label for="nobody-user">Alias</label>
    <input id="nobody-user" type="text" name="user" maxlength="40" autocomplete="nickname" required>
    <button class="faro-button faro-button--primary" type="submit">Emitir mensaje</button>
    <p class="nobody-status" data-nobody-status role="status" aria-live="polite"></p>
  </form>

  <div class="nobody-comments" aria-live="polite">
    <div class="nobody-comments__heading">
      <h3>Mensajes guardados</h3>
      <button type="button" data-nobody-clear-filter hidden>Mostrar todos</button>
    </div>
    <div data-nobody-list></div>
  </div>
</section>

<script>
(() => {
  const zone = document.querySelector('[data-nobody-zone]');
  if (!zone) return;
  const form = zone.querySelector('form');
  const list = zone.querySelector('[data-nobody-list]');
  const status = zone.querySelector('[data-nobody-status]');
  const clearFilter = zone.querySelector('[data-nobody-clear-filter]');
  const storageKey = 'faro:zona-nadie:comments:v2';
  let filter = '';
  let comments = [];
  try { comments = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (_) { comments = []; }
  comments = Array.isArray(comments) ? comments : [];

  const save = () => {
    try { localStorage.setItem(storageKey, JSON.stringify(comments.slice(-100))); } catch (_) { status.textContent = 'No se pudo guardar en este dispositivo.'; }
  };
  const button = (label, handler, className = '') => {
    const element = document.createElement('button');
    element.type = 'button';
    element.textContent = label;
    element.className = className;
    element.addEventListener('click', handler);
    return element;
  };
  const render = () => {
    list.replaceChildren();
    const visible = comments.filter((comment) => !filter || comment.user === filter);
    clearFilter.hidden = !filter;
    if (!visible.length) {
      const empty = document.createElement('p');
      empty.className = 'nobody-empty';
      empty.textContent = filter ? 'No hay mensajes para este alias.' : 'Todavía no hay mensajes guardados en este dispositivo.';
      list.append(empty);
      return;
    }
    visible.slice().reverse().forEach((comment) => {
      const article = document.createElement('article');
      article.className = 'nobody-comment';
      const heading = document.createElement('h4');
      heading.textContent = comment.title || 'Sin título';
      const text = document.createElement('p');
      text.textContent = comment.text;
      const meta = document.createElement('div');
      meta.className = 'nobody-comment__meta';
      meta.append(button(`@${comment.user}`, () => { filter = comment.user; render(); }, 'nobody-alias'));
      const time = document.createElement('time');
      time.dateTime = comment.createdAt;
      time.textContent = new Intl.DateTimeFormat('es', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(comment.createdAt));
      meta.append(time);
      article.append(heading, text, meta);
      list.append(article);
    });
  };
  clearFilter.addEventListener('click', () => { filter = ''; render(); });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    const comment = {
      id: crypto.randomUUID?.() || String(Date.now()),
      title: String(data.get('title') || '').trim(),
      text: String(data.get('text') || '').trim(),
      user: String(data.get('user') || '').trim().replace(/^@+/, ''),
      createdAt: new Date().toISOString()
    };
    if (!comment.text || !comment.user) return;
    status.textContent = 'Enviando…';
    try {
      const response = await fetch(form.action || '/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(data).toString()
      });
      if (!response.ok) throw new Error('Submission failed');
      status.textContent = 'Mensaje enviado al buzón de moderación y guardado localmente.';
    } catch (_) {
      status.textContent = 'Guardado localmente. El buzón de moderación no está disponible ahora.';
    }
    comments.push(comment);
    save();
    form.reset();
    filter = '';
    render();
  });
  render();
})();
</script>
